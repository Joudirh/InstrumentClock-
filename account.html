<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte — Trading Sessions Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/i18n.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="account-body">
  <nav class="navbar" aria-label="Navigation principale">
    <div class="navbar-inner max-w">
      <div class="navbar-logo">
        <span class="navbar-logo-mark">◆</span>
        <span class="navbar-logo-text">Trading Sessions Hub</span>
      </div>
      <a class="navbar-link" href="/" data-i18n="nav.home">Accueil</a>
      <div class="navbar-right">
        <span data-language-switcher></span>
        <button id="account-logout-btn" class="icon-btn login-btn" aria-label="Déconnexion" title="Déconnexion">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w">
    <section class="card account-section">
      <header class="section-header">
        <h2>Mon compte</h2>
        <p class="account-intro">Espace utilisateur — vos préférences et alertes.</p>
      </header>

      <div class="account-grid">
        <div class="account-panel">
          <h3>Profil</h3>
          <div id="account-profile-error" class="account-error hidden" role="alert"></div>
          <div class="account-field">
            <label>Email</label>
            <span id="account-email" class="account-value">—</span>
          </div>
          <div class="account-field">
            <label>Nom</label>
            <input id="account-name" type="text" placeholder="Votre nom">
          </div>
          <div class="account-field">
            <label>Nouveau mot de passe</label>
            <input id="account-password" type="password" placeholder="•••••••• (6 min.)">
          </div>
          <button id="account-save-btn" class="btn-account">Enregistrer</button>
        </div>

        <div class="account-panel">
          <h3>Favoris</h3>
          <div id="account-fav-error" class="account-error hidden" role="alert"></div>
          <div class="account-field">
            <label>Instrument (slug ou ID)</label>
            <input id="account-fav-input" type="text" placeholder="ex. eurusd ou 42">
          </div>
          <button id="account-fav-add-btn" class="btn-account">Ajouter aux favoris</button>
          <div id="account-fav-list" class="account-list"></div>
        </div>

        <div class="account-panel">
          <h3>Alertes de marché</h3>
          <div id="account-alert-error" class="account-error hidden" role="alert"></div>
          <div class="account-field">
            <label>Instrument (slug ou ID)</label>
            <input id="account-alert-input" type="text" placeholder="ex. eurusd ou 42">
          </div>
          <div class="account-field">
            <label>Type</label>
          <select id="account-alert-kind">
            <option value="optimal-open">Ouverture optimale</option>
            <option value="optimal-close">Clôture optimale</option>
          </select>
          </div>
          <button id="account-alert-add-btn" class="btn-account">Ajouter l'alerte</button>
          <div id="account-alert-list" class="account-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/user/app.js"></script>
  <script type="module" src="/js/i18n/bootstrap.js"></script>
</body>
</html>
