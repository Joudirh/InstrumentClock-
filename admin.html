<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Connexion | Trading Sessions Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/i18n.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-login-body">
  <main class="login-wrap">
    <form id="login-form" class="login-card" autocomplete="on" novalidate>
      <div class="login-logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </div>
      <h1>Trading Sessions Hub</h1>
      <p class="login-sub">Interface d'administration</p>

      <div id="login-error" class="login-error hidden" role="alert"></div>

      <label class="field">
        <span>Email</span>
        <input id="login-email" name="email" type="email" placeholder="admin@instrumentclock.com" required autocomplete="username">
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <div class="password-wrap">
          <input id="login-password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" id="login-reveal" class="icon-link" aria-label="Afficher / masquer le mot de passe">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </label>

      <button id="login-submit" type="submit" class="btn-admin btn-admin-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
        Se connecter
      </button>

      <a class="login-back" href="/">← Retour au site</a>
    </form>
  </main>

  <script type="module" src="/js/admin/login.js"></script>
  <script type="module" src="/js/i18n/bootstrap.js"></script>
</body>
</html>
