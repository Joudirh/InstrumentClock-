<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Sessions Hub</title>
  <meta name="description" content="Visualisez les horaires d'ouverture et de fermeture des marchés financiers mondiaux.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/css/flag-icons.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <nav class="navbar" aria-label="Navigation principale">
    <div class="navbar-inner max-w">
      <div class="navbar-logo">
        <span class="navbar-logo-mark">◆</span>
        <span class="navbar-logo-text">Trading Sessions Hub</span>
      </div>

      <ul class="navbar-menu" role="menubar">
        <li role="none"><a class="navbar-link is-active" href="#" data-route="home" role="menuitem">Accueil</a></li>
        <li role="none"><a class="navbar-link" href="#formation" data-route="formation" role="menuitem">Formation</a></li>
        <li role="none"><a class="navbar-link" href="#contact" data-route="contact" role="menuitem">Contact</a></li>
        <li role="none"><a class="navbar-link" href="#apropos" data-route="apropos" role="menuitem">À propos</a></li>
      </ul>

      <div class="navbar-right">
        <button id="theme-toggle" class="icon-btn" aria-label="Basculer le thème" title="Basculer le thème (clair/sombre)">
            <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <button id="login-btn" class="icon-btn login-btn" aria-label="Connexion" title="Connexion">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </nav>

   <main class="max-w">
    <section class="tools-bar" aria-label="Horloge et paramètres">
      <div class="tools-inner">
        <div id="system-clock" class="system-clock">
          <div id="clock-time" class="clock-time">00:00:00</div>
          <div id="clock-date" class="clock-date">Chargement...</div>
        </div>

        <label class="control-group">
          <span>Saison</span>
          <select id="season-selector" aria-label="Sélection de la saison">
            <option value="winter">Hiver (Oct - Mar)</option>
            <option value="summer">Été (Mar - Oct)</option>
          </select>
        </label>

        <label class="control-group">
          <span>Fuseau Horaire</span>
          <select id="timezone-selector" aria-label="Sélection du fuseau horaire">
            <!-- Rempli dynamiquement -->
          </select>
        </label>
      </div>
    </section>

    <section class="sessions-section card">
      <header class="section-header">
        <h2>🌍 Marché Forex 24h</h2>
        <span class="market-badge" id="forex-market-status">Chargement...</span>
      </header>
      
      <div class="timeline-container scroll-x" id="forex-timeline">
        <!-- Rendu dynamique de la timeline Forex -->
      </div>
      
      <div id="world-clocks-container" class="world-clocks-bar">
        <!-- Rempli dynamiquement -->
      </div>
    </section>

    <div class="filters-bar">
      <div class="category-filter">
        <select id="category-tabs" aria-label="Filtrer par catégorie">
          <!-- Rempli dynamiquement -->
        </select>
      </div>

      <button id="sort-optimal" class="sort-btn" type="button" aria-pressed="false"
        title="Trier par plage optimale la plus proche de maintenant"
        aria-label="Trier les instruments par plage optimale la plus proche">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 16 4 4 4-4"></path><path d="M7 20V4"></path>
          <path d="M11 4h10"></path><path d="M11 8h7"></path><path d="M11 12h4"></path>
        </svg>
        <span class="sort-btn-label">Trier optimal</span>
      </button>
      
      <div class="search-filter">
        <input id="instrument-search" type="search" placeholder="Rechercher un instrument…" aria-label="Rechercher un instrument" autocomplete="off">
      </div>
      
      <div class="status-filter">
        <select id="status-selector" aria-label="Filtrer par statut">
          <option value="all">🔍 Tous les statuts</option>
          <option value="open">🟢 Ouverts</option>
          <option value="closed">🔴 Fermés</option>
        </select>
      </div>

      <label class="optimal-filter" title="Afficher uniquement les instruments dont les heures optimales incluent l'heure actuelle">
        <input type="checkbox" id="optimal-toggle" aria-label="Afficher uniquement les instruments dans leur plage horaire optimale actuelle">
        <span class="toggle-switch" aria-hidden="true"></span>
        <span class="toggle-label">Heures optimales</span>
      </label>

      <div class="bell-filter" id="bell-filter">
        <button id="market-bell" class="bell-button" type="button" title="Chargement…" aria-label="Marchés ouverts : chargement" aria-expanded="false" aria-haspopup="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span id="bell-badge" class="bell-badge" aria-hidden="true">–</span>
        </button>
        <div id="bell-panel" class="bell-panel hidden" role="region" aria-label="Marchés ouverts"></div>
      </div>
    </div>

    <p id="holiday-notice" class="holiday-notice" aria-live="polite"></p>

    <section class="instruments-section card" >
      <div id="instruments-container" class="instruments-grid">
        <!-- Rempli dynamiquement en format Desktop/Mobile -->
      </div>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2026 Trading Sessions Hub. Heures adaptées à votre fuseau horaire.</p>
  </footer>

  <button id="scroll-top" class="scroll-top-btn" aria-label="Retour en haut" title="Retour en haut">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <!-- Script d'entrée type module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
